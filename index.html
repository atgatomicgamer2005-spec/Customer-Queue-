<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bank Queue - FIFO</title>
<style>
body{margin:0;background:#0a0a0a;color:#fff;font-family:Inter,Segoe UI;display:flex;justify-content:center;padding:14px}
.wrap{width:100%;max-width:540px;background:#171717;border:1px solid #262626;border-radius:24px;padding:20px}
.top{text-align:center;border-bottom:1px solid #262626;padding-bottom:12px;margin-bottom:14px}
.top h1{margin:0;color:#facc15;font-size:24px;letter-spacing:1px}
.top p{color:#737373;font-size:11px;margin:4px 0 0}
.inputBox{display:flex;gap:8px;margin-bottom:8px}
.inputBox input{flex:1;padding:14px;border-radius:12px;border:1px solid #333;background:#0a0a0a;color:#fff;outline:none}
.mainBtn{width:100%;padding:14px;border:none;border-radius:12px;background:#facc15;color:#000;font-weight:800;font-size:14px;cursor:pointer}
.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:10px}
.actions button{padding:10px;border-radius:10px;border:1px solid #333;background:#262626;color:#a3a3a3;cursor:pointer;font-size:12px}
.line{display:flex;gap:10px;overflow-x:auto;padding:14px;background:#0a0a0a;border:1px dashed #333;border-radius:14px;margin-top:14px;min-height:80px}
.person{ background:#262626; border:1px solid #facc15; border-radius:14px; padding:10px 14px; text-align:center; min-width:85px }
.person.first{ border-color:#22c55e; box-shadow:0 0 15px rgba(34,197,94,.3) }
.tag{font-size:9px;color:#facc15;background:#000;padding:2px 6px;border-radius:20px}
.status{margin-top:12px;padding:12px;border-radius:12px;background:rgba(250,204,21,.08);border:1px solid rgba(250,204,21,.2);text-align:center;color:#facc15;font-size:13px}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><h1>BANK QUEUE LINE</h1><p>FIFO TOKEN SYSTEM - First Come First Served - Queue DS</p></div>
<div class="inputBox"><input id="n" placeholder="Customer name"><input id="t" placeholder="Token" style="max-width:90px"></div>
<button class="mainBtn" onclick="join()">JOIN QUEUE → line.join()</button>
<div class="actions"><button onclick="serve()">SERVE</button><button onclick="next()">NEXT</button><button onclick="reset()">RESET</button></div>
<div class="line" id="line"><div style="margin:auto;color:#444;font-size:13px">Queue empty - head = tail = -1</div></div>
<div class="status" id="st">Ready - Waiting for customers - FIFO enforced</div>
</div>
<script>
let q=[];
let tokenBase=1000;
function draw(){
let el=document.getElementById('line');
if(q.length==0){el.innerHTML='<div style="margin:auto;color:#444;font-size:13px">Queue empty - head = tail = -1</div>';return}
el.innerHTML=q.map((p,i)=>`<div class="person ${i==0?'first':''}"><div class="tag">${i==0?'HEAD - SERVING NEXT':'POS '+i}</div><div style="font-weight:700;margin-top:4px">${p.name}</div><div style="font-size:11px;color:#888">#${p.tok}</div></div>`).join('')
}
function join(){
let name=document.getElementById('n').value.trim();
let tok=document.getElementById('t').value.trim()||'T'+(++tokenBase);
if(!name)return;
q.push({name,tok});
document.getElementById('n').value='';document.getElementById('t').value='';
draw();document.getElementById('st').innerText=`${name} joined | Ticket ${tok} | Behind ${q.length-1} people | tail=${q.length-1}`
}
function serve(){
if(q.length==0)return;
let s=q.shift();
draw();document.getElementById('st').innerText=`Serving ${s.name} Ticket ${s.tok} | ${q.length} left | head=0`
}
function next(){
if(q.length==0)return;
document.getElementById('st').innerText=`Next: ${q[0].name} - Ticket ${q[0].tok} - At counter now`
}
function reset(){q=[];tokenBase=1000;draw();document.getElementById('st').innerText='Queue reset - Ready for new day'}
</script>
</body>
</html>
